name: Daily 10 AM IST Dual-Market Stock Scan & Deploy

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC (Monday to Friday)
    - cron: '30 4 * * 1-5'
    # Optional: uncomment below for a second post-NSE-close refresh at 4:00 PM IST (10:30 UTC)
    # - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python scanner dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run US + India Multi-Timeframe Scanner
        run: python scripts/scan_markets.py

      - name: Commit updated JSON snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/us_scan.json public/data/india_scan.json
          git diff --staged --quiet || git commit -m "chore: update 10 AM IST market scan snapshots"
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies & build
        run: |
          npm ci || npm install
          npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: scan-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
